<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
     role="img" aria-label="Service image placeholder">
  <title>Brightwork service placeholder</title>
  <desc>3:2 placeholder shown where a business has not uploaded a photograph. The gradient derives from one brand colour.</desc>

  <defs>
    <!-- linear-gradient(135deg, lighten(brand, 30%), brand) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D83F1"/>
      <stop offset="1" stop-color="#004EEB"/>
    </linearGradient>

    <!-- the dot field, one dot per 30px tile -->
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.9"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#brand)"/>
  <rect width="1200" height="800" fill="url(#dots)" opacity="0.22"/>
  <circle cx="196" cy="180" r="260" fill="#FFFFFF" fill-opacity="0.14"/>
</svg>
